<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="utility.css">
    <script src="playlist.js" defer></script>
    <script src="script.js" defer></script>
</head>

<body>
    <div class="nav">
        <div class="logo"><img width="40" height="40" src="https://img.icons8.com/fluency/48/spotify.png"
                alt="spotify" /></div>
        <div class="home"><img width="45" height="45" src="Images/icons8-home.svg" alt="" srcset=""></div>
        <div class="search"> <img src="Images/search.svg" alt="" srcset="">
            <p>What do you want to play?</p>
        </div>
        <div class="psd">
            <ul>
                <li>Premium</li>
                <li>Support</li>
                <li>Download</li>
            </ul>
        </div>
        <div class="isl">
            <ul>
                <li> <img width="16" height="16" src="Images/icons8-arrow-down-24.png" alt="" srcset="">Install App</li>
                <li>Sign up</li>
            </ul>
            <div class="login">Log in</div>
        </div>
    </div>
    <div class="main">
        <div class="left"> savdjasd</div>
        <div class="right">
            <div class="cat">
                <ul>
                    <li>All</li>
                    <li>Music</li>
                    <li>Podcast</li>
                </ul>
            </div>
            <div class="cont_header">
                <div class="al_header fontc">
                    <h2>Popular Albums and Singles</h2>
                    <p>Show All</p>
                </div>
                <div class="carousel">
                    <button class="nav-btn left-btn">&#10094;</button>
                    <div class="cont_cards" id="playlistContainer">
                        <!-- Cards will be injected dynamically here -->

                    </div>
                    <button class="nav-btn right-btn">&#10095;</button>
                </div>
            </div>
            <div class="player">
                <div class="player-left player-column"><img id="cover" src="">
                <div class="songInfo fontc">
                    <h4 id="title">No Song</h4>
                    <p id="artist">---</p>
                </div>
                </div>
                <div class="player-centre player-column">
                    <div class="player-controls">
                        <button id="prev">⏮</button>
                        <button id="playPause">&#9658;</button>
                        <button id="next">⏭</button>
                    </div>
                    <div class="playback-bar">
                        <span id="currentTime" class="time-text">0:00</span>
                        <input type="range" id="progress" value="0" min="0" max="100">
                        <span id="totalTime" class="time-text">0:00</span>
                    </div>
                </div>
                <div class="player-right player-column"> 
                    <div class="volume-control">
                        <span class="volume-icon">🔊</span>
                        <input type="range" id="volume" value="100" min="0" max="100">
                    </div>
                </div>
            </div>
            <div id="playlistModal" class="modal-overlay">
                <div class="modal-content">
                    <span class="close-modal">&times;</span>
                    <div class="modal-header">
                        <img id="modalCover" src="" alt="Cover">
                        <div class="modal-info">
                            <h2 id="modalTitle">Playlist Title</h2>
                            <p id="modalArtist">Artist</p>
                        </div>
                    </div>
                    <div class="modal-songs-list" id="modalSongsList">
                        <!-- Song items will be injected here -->
                    </div>
                </div>
            </div>
            <audio id="audioPlayer"></audio>
    </div>
</body>
</html>
